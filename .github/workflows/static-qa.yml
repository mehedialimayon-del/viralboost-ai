name: Static QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run HTML and JavaScript static checks
        run: python3 qa_static.py
